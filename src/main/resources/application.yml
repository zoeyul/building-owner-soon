spring:
  application.name: backend
  r2dbc:
    url: ${db-host}
    username: ${db-user}
    password: ${db-password}
  datasource:
    url: ${jdbc-url:jdbc:mariadb://localhost:13306/bos}
    username: ${db-user}
    password: ${db-password}
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    url: ${jdbc-url:jdbc:mariadb://localhost:13306/bos}
    user: ${db-user}
    password: ${db-password}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail-username}
    password: ${mail-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${redis-host:localhost}
      port: ${redis-port:6379}

application:
  jwt:
    secret: ${jwt-secret}
    access-token-expiration: 3600 # 60 * 60 (1 hour)
    refresh-token-expiration: 604800 # 3600 * 24 * 7 (7 days)

app:
  s3:
    bucket-name: ${s3-bucket-name}
    base-url: ${s3-base-url}

apple:
  bundle-id: ${apple-bundle-id:app.bos.buildingownersoon}
  team-id: ${apple-team-id:}
  client-id: ${apple-client-id:}
  key-id: ${apple-key-id:}
  private-key: ${apple-private-key:}
  redirect-uri: ${apple-redirect-uri:https://api.buildingownersoon.app/oauth/apple}

logging:
  level:
    org.springframework.data.r2dbc: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.transaction: DEBUG
    io.r2dbc: DEBUG

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://192.168.0.6:3000"
    - "https://192.168.0.6:3000"
    - "https://buildingownersoon.app"
    - "https://www.buildingownersoon.app"
    - "https://appleid.apple.com"
  allowed-methods:
    - "HEAD"
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
  allowed-headers:
    - "*"
server:
  port: 8000
push:
  test:
    auth:
      username: ${push-test-name}
      password: ${push-test-password}
